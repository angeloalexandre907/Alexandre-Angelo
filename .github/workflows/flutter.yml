herename: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      - run: cp lib/main.dart /tmp/main.dart && cp pubspec.yaml /tmp/pubspec.yaml
      - run: flutter create . --platforms=android --org com.example.biblioteca --project-name biblioteca
      - run: cp /tmp/main.dart lib/main.dart && cp /tmp/pubspec.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
